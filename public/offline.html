<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hors connexion — ImmoVerdict</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --deep:#0C0C10;
  --surface:#131318;
  --off-white:#F0EBE0;
  --muted:rgba(240,235,224,0.65);
  --orange:#F97316;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
body{
  background:var(--deep);
  color:var(--off-white);
  font-family:var(--sans);
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
  text-align:center;
}
.container{
  max-width:480px;
}
.icon{
  font-size:4rem;
  margin-bottom:1.5rem;
  display:block;
}
h1{
  font-family:var(--serif);
  font-size:2rem;
  line-height:1.15;
  margin-bottom:1rem;
  color:var(--off-white);
}
p{
  color:var(--muted);
  font-size:1rem;
  line-height:1.6;
  margin-bottom:2rem;
}
.btn{
  display:inline-block;
  background:var(--orange);
  color:#fff;
  font-family:var(--sans);
  font-weight:600;
  font-size:0.95rem;
  padding:.75rem 1.75rem;
  border-radius:8px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  transition:opacity .15s;
}
.btn:hover{opacity:.85}
.status{
  margin-top:2.5rem;
  font-size:.8rem;
  color:rgba(240,235,224,0.3);
}
</style>
</head>
<body>
<div class="container">
  <span class="icon">📡</span>
  <h1>Pas de connexion</h1>
  <p>ImmoVerdict n'est pas accessible sans Internet.<br/>
  Reconnecte-toi puis réessaie — tes simulations t'attendent.</p>
  <button class="btn" onclick="window.location.reload()">Réessayer</button>
  <p class="status">immoverdict.com · simulateur LMNP gratuit</p>
</div>
</body>
</html>
